id: baota-panel
name: 服务器助手
version: 1.5.1
description: 通过 SSH 直连服务器做真实运维，兼容普通 Linux 与宝塔面板。
systemPrompt: prompt.md
avatar: icon.png
author: 橙子桌面
maxSteps: 0
skills:
  - server-ops
  - fnos

env:
  - name: BT_PANELS
    label: 服务器清单（每行一台服务器）
    type: list
    required: true
    items:
      - name: alias
        label: 别名
        required: true
      - name: host
        label: 主机IP
        required: true
      - name: port
        label: 端口（留空=22）
      - name: user
        label: 用户（留空=root）
      - name: pass
        label: 密码（留空改用本机私钥）
        secret: true
