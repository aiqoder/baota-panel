id: baota-panel
name: 服务器与飞牛 NAS 助手
version: 1.5.0
description: 通过 SSH 直连服务器做真实运维，兼容普通 Linux 与宝塔面板；并可通过 trim-cli 以 OAuth 管理飞牛 fnOS 的文件、相册、应用、Docker、下载、日志、监控、网络、存储与用户。服务器按别名指定、数量不限；NAS 主机可留空走本机默认。本机零 Python 依赖。
systemPrompt: prompt.md
avatar: icon.png
author: 橙子桌面
maxSteps: 0
skills:
  - server-ops
  - fnos

env:
  - name: BT_PANELS
    label: 服务器清单（每行一台服务器）
    type: list
    required: true
    items:
      - name: alias
        label: 别名（调用时用于指定目标，如 hk-1）
        required: true
      - name: host
        label: 主机（IP 或域名）
        required: true
      - name: port
        label: SSH 端口（留空=22）
      - name: user
        label: SSH 用户（留空=root）
      - name: pass
        label: SSH 密码（留空改用本机私钥）
        secret: true
  - name: FNOS_HOST
    label: NAS 主机（IP 或域名，留空=localhost）
  - name: FNOS_PORT
    label: NAS 端口（留空：本机 5666 / 远程 IP 5667 / 域名 443）
  - name: FNOS_SCHEME
    label: NAS 协议 auto / http / https（留空=auto）
